--text: #f0f0f5; --text-muted: #8a8a9a; --text-dim: #5a5a6a;

* { margin: 0; padding: 0; box-sizing: border-box; }

.trust-badges { display: flex; gap: 14px; margin: 20px 0; padding: 16px; background: var(--surface);
border-radius: var(--radius-sm); }

.action-buttons { display: flex; gap: 12px; margin-top: auto; }

let searchTerm = '';

function renderVehicles() {
let filtered = vehicles.filter(v => {
const matchesCondition = currentFilter === 'all' || v.condition === currentFilter;
const matchesSearch = v.model.toLowerCase().includes(searchTerm.toLowerCase()) || 
v.brand.toLowerCase().includes(searchTerm.toLowerCase());
return matchesCondition && matchesSearch;
});

const grid = document.getElementById('vehicleGrid');
grid.innerHTML = filtered.map(v => `
<div class="vehicle-card" onclick="openVehicleModal(${v.id})">
<div class="vehicle-img-wrap">
<img src="${v.image}" alt="${v.model}" loading="lazy">
<div class="vehicle-badge">${v.condition.toUpperCase()}</div>
<button class="wishlist-btn" onclick="event.stopPropagation(); addToWishlist(${v.id})">
<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
</button>
</div>
<div class="vehicle-info">
<div class="vehicle-model">${v.model}</div>
<div class="vehicle-year-trim">${v.year} • ${v.trim}</div>
<div class="vehicle-specs">
<div class="vehicle-spec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>${v.mileage}</div>
<div class="vehicle-spec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4m0 12l4-4m-4 4l-4-4"/></svg>${v.transmission}</div>
</div>
<div class="vehicle-condition">${v.condition.charAt(0).toUpperCase() + v.condition.slice(1)} Condition</div>
<div class="vehicle-price-row">
<div class="vehicle-price">₦${(v.price / 1000000).toFixed(1)}M</div>
<div class="vehicle-old-price">₦${(v.oldPrice / 1000000).toFixed(1)}M</div>
</div>
<button class="vehicle-action-btn" onclick="event.stopPropagation(); addToCart(${v.id})">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2L6.46 9H2v2h2.08L5 20c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2l1.92-9H22v-2h-4.54L15 2H9zm3.5 5h1L14 9h-3.5L12 7z"/></svg>
Add to Cart
</button>
</div>
</div>
`).join('');
}

function filterByCondition(condition) {
currentFilter = condition;
document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
event.target.classList.add('active');
renderVehicles();
}

function filterVehicles() {
searchTerm = document.getElementById('searchInput').value;
renderVehicles();
}

function openVehicleModal(id) {
const vehicle = vehicles.find(v => v.id === id);
const modal = document.getElementById('vehicleModal');
const detail = document.getElementById('vehicleDetail');
detail.innerHTML = `
<div class="detail-img-wrap"><img src="${vehicle.image}" alt="${vehicle.model}"></div>
<div class="detail-content">
<div class="detail-model">${vehicle.model}</div>
<div class="detail-year">${vehicle.year} • ${vehicle.trim}</div>
<div class="detail-price">₦${(vehicle.price / 1000000).toFixed(1)}M</div>
<div class="detail-desc">${vehicle.description}</div>
<div class="specs-section">
<h3>Vehicle Specifications</h3>
<div class="specs-grid">
<div class="spec-item"><span class="spec-item-label">Mileage</span><span class="spec-item-value">${vehicle.mileage}</span></div>
<div class="spec-item"><span class="spec-item-label">Year</span><span class="spec-item-value">${vehicle.year}</span></div>
<div class="spec-item"><span class="spec-item-label">Transmission</span><span class="spec-item-value">${vehicle.transmission}</span></div>
<div class="spec-item"><span class="spec-item-label">Condition</span><span class="spec-item-value">${vehicle.condition.charAt(0).toUpperCase() + vehicle.condition.slice(1)}</span></div>
</div>
</div>
<div class="trust-badges">
<div class="trust-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><div>Verified</div></div>
<div class="trust-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m7 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><div>Certified</div></div>
<div class="trust-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m-9 8a9 9 0 1118 0 9 9 0 01-18 0z"/></svg><div>Insured</div></div>
</div>
<div class="action-buttons">
<button class="btn-primary" onclick="addToCart(${vehicle.id}); closeVehicleModal(); showToast('Added to cart!')">Add to Cart</button>
<button class="btn-secondary" onclick="showToast('Contact us for financing options')">Finance Info</button>
</div>
</div>
`;
modal.classList.add('open');
}

function closeVehicleModal() {
document.getElementById('vehicleModal').classList.remove('open');
}

function addToCart(vehicleId) {
const vehicle = vehicles.find(v => v.id === vehicleId);
let cart = JSON.parse(localStorage.getItem('app-cart') || '[]');
const existing = cart.find(item => item.id === vehicleId);

if (existing) {
existing.qty += 1;
} else {
cart.push({...vehicle, qty: 1});
}

localStorage.setItem('app-cart', JSON.stringify(cart));
updateCartUI();
showToast(`Added ${vehicle.model} to cart!`);
}

function updateCartUI() {
const cart = JSON.parse(localStorage.getItem('app-cart') || '[]');
const count = cart.reduce((sum, item) => sum + item.qty, 0);
document.getElementById('cartBadge').textContent = count;

const cartItemsDiv = document.getElementById('cartItems');
const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

if (cart.length === 0) {
cartItemsDiv.innerHTML = `<div class="cart-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M6 6L5 3H2"/></svg><div>Your cart is empty</div></div>`;
} else {
cartItemsDiv.innerHTML = cart.map(item => `
<div class="cart-item">
<img src="${item.image}" alt="${item.model}" class="cart-item-img">
<div class="cart-item-info">
<div class="cart-item-name">${item.model}</div>
<div class="cart-item-price">₦${(item.price / 1000000).toFixed(1)}M</div>
<div class="cart-item-qty">
<button onclick="updateQty(${item.id}, -1)">−</button>
<span>${item.qty}</span>
<button onclick="updateQty(${item.id}, 1)">+</button>
</div>
</div>
<button class="cart-item-remove" onclick="removeFromCart(${item.id})">×</button>
</div>
`).join('');
}

document.getElementById('subtotal').textContent = `₦${(subtotal / 1000000).toFixed(1)}M`;
document.getElementById('cartTotal').textContent = `₦${(subtotal / 1000000).toFixed(1)}M`;
}

function updateQty(vehicleId, change) {
let cart = JSON.parse(localStorage.getItem('app-cart') || '[]');
const item = cart.find(v => v.id === vehicleId);
if (item) {
item.qty += change;
if (item.qty <= 0) {
cart = cart.filter(v => v.id !== vehicleId);
}
localStorage.setItem('app-cart', JSON.stringify(cart));
updateCartUI();
}
}

function removeFromCart(vehicleId) {
let cart = JSON.parse(localStorage.getItem('app-cart') || '[]');
cart = cart.filter(v => v.id !== vehicleId);
localStorage.setItem('app-cart', JSON.stringify(cart));
updateCartUI();
showToast('Removed from cart');
}

function openCart() {
document.getElementById('cartOverlay').classList.add('open');
document.getElementById('cartSidebar').classList.add('open');
}

function closeCart() {
document.getElementById('cartOverlay').classList.remove('open');
document.getElementById('cartSidebar').classList.remove('open');
}

function goToCheckout() {
const cart = JSON.parse(localStorage.getItem('app-cart') || '[]');
if (cart.length === 0) {
showToast('Add items to cart first', 'error');
return;
}
window.location.href = '../checkout/';
}

function toggleTheme() {
const body = document.body;
const current = body.getAttribute('data-theme');
const next = current === 'dark' ? 'light' : 'dark';
body.setAttribute('data-theme', next);
localStorage.setItem('app-theme', next);
}

const savedTheme = localStorage.getItem('app-theme');
if (savedTheme) document.body.setAttribute('data-theme', savedTheme);

function addToWishlist(vehicleId) {
showToast('Added to wishlist!');
}

function showToast(message) {
const toast = document.getElementById('toast');
toast.textContent = message;
toast.classList.add('show');
setTimeout(() => toast.classList.remove('show'), 3000);
}

// Initial render
renderVehicles();
updateCartUI();
</script>
</body>
</html>
